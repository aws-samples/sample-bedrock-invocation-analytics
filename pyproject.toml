[project]
name = "sample-bedrock-invocation-analytics"
version = "3.6.0"
description = "Bedrock invocation logging analytics - monitor token usage, costs and performance"
requires-python = ">=3.13"
dependencies = [
    "aws-cdk-lib>=2.253.0",
    "constructs>=10.0.0",
    "boto3",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "aws-lambda-powertools>=3.38.0",
    "pyjwt[crypto]>=2.15.1",
    "pytest>=9.2.0",
]
