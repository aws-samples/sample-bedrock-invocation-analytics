# Bedrock Invocation Analytics — Deployment Configuration
# Copy this file to config.yaml and edit with your account details.
#
# The account marked 'primary: true' deploys the full stack (pipeline, DynamoDB, pricing, WebUI).
# Other accounts deploy a lightweight spoke stack (S3, Bedrock logging, parse_log Lambda → primary account's Firehose).

data:
  bedrock_log_prefix: bedrock/invocation-logs/
  cost_agg_interval_min: 5        # minutes between L2 runs; >= 2 (Firehose buffers 60s)

# Alarm notifications (optional). Confirm the SNS subscription email after deploy.
alerts:
  email: ""

# WebUI: React SPA behind an internal ALB, Cognito sign-in
webui:
  cloudfront: false          # true = also deploy CloudFront (VPC origin → internal ALB); public HTTPS on *.cloudfront.net
  vpc_id: ""                 # empty = create a minimal VPC (2 AZs, no NAT)
  subnet_ids: []             # private subnets for the ALB when vpc_id is set (2+ AZs)
  allowed_cidrs: []          # intranet ranges allowed to reach the ALB directly (VPN, office network)
  certificate_arn: ""        # optional ACM certificate; enables 443 HTTPS for direct ALB access (otherwise plaintext HTTP 80)
  cognito_user_pool_id: ""   # empty = create a user pool; set to reuse an existing one
  initial_admin_email: ""    # created pool only: first admin, temporary password sent by email
  admin_group: bedrock-analytics-admin    # group whose members can edit pricing; empty = the stack creates bedrock-analytics-admin. Everyone else is read-only

accounts:
  - profile: default           # AWS CLI profile name
    name: myaccount           # friendly name for this account (display in WebUI)
    region: us-west-2
    bucket: ""                 # existing S3 bucket name, or empty to create new
    primary: true              # primary account (only one)

  - profile: application
    name: appaccount
    region: us-east-1
    bucket: ""                 # existing S3 bucket name, or empty to create new

  # Add more accounts as needed:
  # - profile: another-profile
  #   region: us-west-2
  #   bucket: ""
